<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101419"><title>WaveCan Rover Drive</title>
<style>
:root{color-scheme:dark;--bg:#101419;--panel:#1a222a;--line:#303b45;--ink:#f2f5f7;--muted:#98a8b5;--cyan:#53d6ce;--red:#fa5d68;--green:#90e5a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#263a42 0,transparent 55%),var(--bg);color:var(--ink);font:500 16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh;touch-action:manipulation}
button,input{font:inherit}button{border:1px solid var(--line);border-radius:15px;background:#27323c;color:var(--ink);padding:14px 18px;font-weight:800;letter-spacing:.04em}button:active{transform:scale(.98)}.shell{max-width:1100px;margin:auto;padding:clamp(14px,3vw,30px);display:grid;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(22px,4vw,34px);font-weight:950;letter-spacing:.12em}.sub{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}.pill{border:1px solid var(--line);border-radius:99px;padding:9px 13px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7b878f;margin-right:8px}.card{background:linear-gradient(150deg,#202a33,#171d23);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.4vw,22px);box-shadow:0 12px 28px #0003}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.grow{flex:1}.safety{display:grid;grid-template-columns:1fr 1.2fr;gap:12px}.arm{background:#1e493a;border-color:#357957;min-height:72px;color:#bbf2c8}.arm[aria-pressed=true]{background:#ffb84a;color:#241900;border-color:#ffcf7d}.estop{background:#711f2b;border-color:#c34450;min-height:72px;color:white;font-size:20px}.section-title{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.15em;font-weight:850}.drive{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side{min-height:300px;display:grid;grid-template-rows:auto 1fr auto;gap:12px}.side-head{display:flex;justify-content:space-between;align-items:center}.side-name{font-size:19px;font-weight:900;letter-spacing:.09em}.percent{font-variant-numeric:tabular-nums;color:var(--cyan);font-size:27px;font-weight:950}.axis{position:relative;border-radius:18px;background:#11171c;border:1px solid #39454e;overflow:hidden;min-height:190px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}.axis::before,.axis::after{content:"";position:absolute;background:#29343d}.axis::before{width:1px;height:100%}.axis::after{height:1px;width:100%}.knob{z-index:1;width:78px;height:78px;border-radius:25px;background:linear-gradient(145deg,#69e2d8,#269d9c);box-shadow:0 8px 18px #0007, inset 0 2px 1px #ffffff80;pointer-events:none;transform:translate(var(--x,0px),var(--y,0px));transition:transform .06s}.ids{width:100%;background:#11171c;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#10171c;border-radius:14px;padding:12px}.stat b{display:block;font-size:clamp(19px,4vw,25px);font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.footer{color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}
@media(max-width:650px){.safety{grid-template-columns:1fr 1fr}.drive{gap:9px}.side{padding:12px;min-height:260px}.axis{min-height:180px}.knob{width:64px;height:64px}.stats{grid-template-columns:repeat(2,1fr)}.pill{font-size:12px}.brand{font-size:22px}}
</style>
</head>
<body><main class="shell">
  <header class="top"><div><div class="brand">WAVECAN <span style="color:var(--cyan)">ROVER</span></div><div class="sub">Drive and motor test · Raspberry Pi</div></div><div class="pill" id="connection"><i class="dot"></i>Checking CAN…</div></header>
  <section class="safety"><button class="arm" id="arm" aria-pressed="false">ENABLE DRIVE</button><button class="estop" id="stop">■ &nbsp; STOP ALL</button></section>
  <section class="drive">
    <article class="card side"><div class="side-head"><span class="side-name">LEFT SIDE</span><strong class="percent" id="leftValue">0%</strong></div><div class="axis" data-side="left"><div class="knob"></div></div><label><span class="section-title">Motor IDs</span><input class="ids" id="leftIds" value="1,2" aria-label="Left motor IDs"></label></article>
    <article class="card side"><div class="side-head"><span class="side-name">RIGHT SIDE</span><strong class="percent" id="rightValue">0%</strong></div><div class="axis" data-side="right"><div class="knob"></div></div><label><span class="section-title">Motor IDs</span><input class="ids" id="rightIds" value="3,4" aria-label="Right motor IDs"></label></article>
  </section>
  <section class="card"><div class="section-title" style="margin-bottom:10px">Live motor telemetry</div><div class="stats"><div class="stat"><b id="rpm">—</b><span>Selected RPM</span></div><div class="stat"><b id="output">—</b><span>Output</span></div><div class="stat"><b id="current">—</b><span>Current</span></div><div class="stat"><b id="temp">—</b><span>Temperature</span></div></div><div class="row" style="margin-top:14px"><label class="grow"><span class="section-title">Test motor ID</span><input class="ids" id="testId" type="number" min="1" max="63" value="1"></label><label class="grow"><span class="section-title">Direct output</span><input class="ids" id="testOutput" type="number" min="-100" max="100" value="0"></label><button id="testApply">SET OUTPUT</button><button id="testStop">STOP MOTOR</button></div></section>
  <div class="footer">Hold a pad to drive. Release to send zero. Use STOP ALL if the rover behaves unexpectedly.</div>
</main>
<script>
const $=id=>document.getElementById(id);const state={armed:false,active:new Set(),values:{left:0,right:0},motors:[]};
const idsFor=side=>$(side+'Ids').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=1&&x<=63);
async function command(id,value,forceStop=false){try{const r=await fetch('/api/motor/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,cmd:'set',value,force_stop:forceStop})});if(!r.ok)throw Error((await r.json()).error||r.statusText)}catch(e){$('connection').innerHTML='<i class="dot" style="background:var(--red)"></i>Drive link error';state.armed=false;paintArm()}}
async function roverPost(body,keepalive=false){const r=await fetch('/api/rover/drive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive});if(!r.ok)throw Error((await r.json()).error||r.statusText)}
async function systemCommand(op){await roverPost({op},op==='stop')}
let driveTimer=0;function sendDrive(){driveTimer=0;if(!state.armed)return;roverPost({op:'drive',left:state.values.left,right:state.values.right,left_ids:idsFor('left'),right_ids:idsFor('right')}).catch(()=>{state.armed=false;paintArm();$('connection').innerHTML='<i class="dot" style="background:var(--red)"></i>Drive link error'})}function queueDrive(immediate=false){if(driveTimer)clearTimeout(driveTimer);driveTimer=setTimeout(sendDrive,immediate?0:60)}
function paintArm(){$('arm').setAttribute('aria-pressed',String(state.armed));$('arm').textContent=state.armed?'DRIVE ENABLED':'ENABLE DRIVE'}
async function stopAll(){state.armed=false;state.values.left=state.values.right=0;state.active.clear();document.querySelectorAll('.axis .knob').forEach(k=>{k.style.setProperty('--x','0px');k.style.setProperty('--y','0px')});$('leftValue').textContent=$('rightValue').textContent='0%';paintArm();try{await systemCommand('stop')}catch(e){$('connection').innerHTML='<i class="dot" style="background:var(--red)"></i>Stop request failed'}}
$('arm').onclick=async()=>{if(state.armed){await stopAll();return}try{await systemCommand('arm');state.armed=true;paintArm();queueDrive(true)}catch(e){$('connection').innerHTML='<i class="dot" style="background:var(--red)"></i>Enable failed'}};$('stop').onclick=stopAll;
function bindPad(pad){const side=pad.dataset.side,knob=pad.querySelector('.knob');let rect,active=false;function move(e){if(!active||!state.armed)return;const dx=Math.max(-1,Math.min(1,(e.clientX-(rect.left+rect.width/2))/(rect.width*.39)));const dy=Math.max(-1,Math.min(1,-(e.clientY-(rect.top+rect.height/2))/(rect.height*.39)));const duty=Math.round(dy*100)/100;state.values[side]=Math.abs(duty)<.04?0:duty;knob.style.setProperty('--x',`${dx*rect.width*.25}px`);knob.style.setProperty('--y',`${-dy*rect.height*.25}px`);$(side+'Value').textContent=`${Math.round(state.values[side]*100)}%`;queueDrive()}function end(){if(!active)return;active=false;state.active.delete(side);state.values[side]=0;knob.style.setProperty('--x','0px');knob.style.setProperty('--y','0px');$(side+'Value').textContent='0%';queueDrive(true)}pad.addEventListener('pointerdown',e=>{if(!state.armed)return;active=true;state.active.add(side);rect=pad.getBoundingClientRect();pad.setPointerCapture(e.pointerId);move(e)});pad.addEventListener('pointermove',move);pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);pad.addEventListener('lostpointercapture',end)}document.querySelectorAll('.axis').forEach(bindPad);
$('testApply').onclick=async()=>{if(!state.armed)return alert('Enable drive first');const id=Number($('testId').value),pct=Number($('testOutput').value);if(!Number.isInteger(id)||id<1||id>63||!Number.isFinite(pct)||pct< -100||pct>100)return alert('Use motor ID 1–63 and output -100% to 100%.');try{await roverPost({op:'motor',motor_id:id,value:pct/100})}catch(e){alert(e.message)}};$('testStop').onclick=()=>roverPost({op:'motor',motor_id:Number($('testId').value),value:0});
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();state.motors=d.motors||[];const can=d.can_bus||{};if(d.rover_control&&state.armed!==d.rover_control.armed){state.armed=d.rover_control.armed;paintArm()}$('connection').innerHTML=`<i class="dot" style="background:${state.motors.length?'var(--green)':'#7b878f'}"></i>${state.motors.length} motors · ${can.interface||'CAN'}`;const m=state.motors.find(x=>Number(x.motor_id)===Number($('testId').value))||state.motors[0];if(m){$('rpm').textContent=Math.round(m.rpm??0).toLocaleString();$('output').textContent=`${(m.output_percent??0).toFixed(0)}%`;$('current').textContent=`${(m.current_amps??0).toFixed(1)} A`;$('temp').textContent=`${(m.temperature_c??0).toFixed(0)} °C`}}catch{$('connection').innerHTML='<i class="dot" style="background:var(--red)"></i>Pi offline'}}setInterval(refresh,250);setInterval(()=>{if(state.armed)roverPost({op:'heartbeat'}).catch(stopAll)},150);refresh();window.addEventListener('pagehide',stopAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});
</script></body></html>
