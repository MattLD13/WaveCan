name: Build Rover Controller Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows
          - os: macos-latest
            asset: macos
          - os: ubuntu-22.04
            asset: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r desktop/requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Build Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name WaveCanRover --collect-submodules bleak run_rover_app.py
          Compress-Archive -Path dist/WaveCanRover.exe -DestinationPath dist/WaveCanRover-windows-x64.zip
      - name: Build macOS download
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name WaveCanRover --osx-bundle-identifier com.lusi.wavecanrover --collect-submodules bleak run_rover_app.py
          plist="dist/WaveCanRover.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :NSBluetoothAlwaysUsageDescription "WaveCan Rover scans for and controls a rover over Bluetooth."' "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :NSBluetoothAlwaysUsageDescription string "WaveCan Rover scans for and controls a rover over Bluetooth."' "$plist"
          ditto -c -k --sequesterRsrc --keepParent dist/WaveCanRover.app dist/WaveCanRover-macos.zip
      - name: Build Linux download
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name WaveCanRover --collect-submodules bleak run_rover_app.py
          tar -czf dist/WaveCanRover-linux-x64.tar.gz -C dist WaveCanRover
      - uses: actions/upload-artifact@v4
        with:
          name: rover-${{ matrix.asset }}
          path: dist/WaveCanRover-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and attach downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --title "WaveCan Rover $TAG" --generate-notes
